[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "injectguard"
version = "0.1.0"
description = "Multi-modal Prompt Injection Firewall"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "InjectGuard Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
training = [
    "datasets>=2.16.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "mlflow>=2.9.0",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "pip-audit>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
